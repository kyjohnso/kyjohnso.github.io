<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Fifty States — Atlas & Quiz</title>
<style>
:root{
  --paper:#f3edda; --paper2:#ece4cb; --ink:#3c3122; --ink2:#6b5d45;
  --ocean:#cfe0e6; --rule:#8a7a5c; --red:#9e2b25; --gold:#c8912b;
  --t0:#f2dfa0; --t1:#efb8a0; --t2:#b7d6a6; --t3:#a6c7de;
  --t0h:#eccf72; --t1h:#e79c7c; --t2h:#96c47e; --t3h:#7fb0d2;
  --good:#2e7d43; --bad:#b3402f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:radial-gradient(ellipse at 30% 10%, rgba(255,255,255,.5), transparent 55%),
    radial-gradient(ellipse at 80% 90%, rgba(138,122,92,.12), transparent 60%);
  color:var(--ink);
  font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;
  padding:14px;
}
.cartouche{
  max-width:1180px;margin:0 auto 14px;text-align:center;
  border:3px double var(--rule);border-radius:4px;background:var(--paper2);
  padding:14px 16px 12px;position:relative;
}
.cartouche::before,.cartouche::after{content:"✦";color:var(--red);position:absolute;top:50%;transform:translateY(-50%);font-size:20px}
.cartouche::before{left:18px}.cartouche::after{right:18px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0;
  font-size:clamp(20px,3.4vw,34px);letter-spacing:.14em;text-transform:uppercase}
.sub{font-family:Georgia,serif;font-style:italic;color:var(--ink2);margin-top:2px;font-size:clamp(12px,1.6vw,15px)}
.rulebar{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:8px;color:var(--ink2);font-size:12px;letter-spacing:.22em;text-transform:uppercase}
.rulebar::before,.rulebar::after{content:"";height:1px;background:var(--rule);flex:1;max-width:180px}

.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.mappanel{background:var(--ocean);border:2px solid var(--rule);border-radius:6px;padding:8px;box-shadow:inset 0 0 40px rgba(60,49,34,.15);position:relative;overflow:hidden}
#map{width:100%;height:auto;display:block;touch-action:none;cursor:grab}
#map.panning{cursor:grabbing}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:8px 4px 2px;font-size:12.5px;color:var(--ink2)}
.legend .cap{color:var(--red);font-size:15px}
.legend .vd{width:14px;height:11px;border-radius:2px;background:transparent;border:2.6px solid #6b4a12;display:inline-block;box-sizing:border-box;vertical-align:-1px}

.side{background:var(--paper2);border:2px solid var(--rule);border-radius:6px;padding:12px;min-height:420px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:8px 6px;font:600 13px/1 inherit;letter-spacing:.08em;text-transform:uppercase;
  border:1.5px solid var(--rule);background:var(--paper);color:var(--ink2);border-radius:4px;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.hintcard{color:var(--ink2);font-style:italic;text-align:center;padding:34px 8px}
.factcard h2{font-family:Georgia,serif;margin:0 0 2px;font-size:24px}
.nick{font-family:Georgia,serif;font-style:italic;color:var(--red);margin:0 0 10px;font-size:15px}
.frow{display:flex;gap:8px;padding:6px 0;border-top:1px dotted var(--rule);font-size:14.5px}
.frow b{flex:0 0 108px;color:var(--ink2);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.facts{border-top:1px dotted var(--rule);margin-top:2px;padding-top:8px;font-size:14.5px}
.facts p{margin:0 0 8px}
.visitbtn{width:100%;margin-top:10px;padding:10px;border-radius:4px;border:1.5px solid var(--rule);
  background:var(--paper);font:600 14px inherit;color:var(--ink);cursor:pointer}
.visitbtn.v{background:var(--gold);border-color:#8a6317;color:#2e2410}
.vcount{margin-top:10px;text-align:center;font-size:13px;color:var(--ink2)}
.vcount b{color:var(--red);font-size:16px}

.qmenutitle{font-family:Georgia,serif;font-size:18px;text-align:center;color:var(--ink2);margin:4px 0 10px;letter-spacing:.04em}
.qmodes{display:grid;gap:8px}
.qmodes button{padding:12px 10px;text-align:left;border:1.5px solid var(--rule);border-radius:4px;background:var(--paper);cursor:pointer;font:inherit}
.qmodes button b{display:block;font-size:15px}
.qmodes button span{font-size:12.5px;color:var(--ink2)}
.qmodes .best{float:right;font-size:12px;color:var(--red);font-weight:700}
.qhead{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink2);margin-bottom:8px}
.qhead b{color:var(--ink)}
.question{font-family:Georgia,serif;font-size:19px;margin:4px 0 12px;min-height:56px}
.opts{display:grid;gap:8px}
.opts button{padding:11px 10px;border:1.5px solid var(--rule);border-radius:4px;background:var(--paper);font:inherit;font-size:15px;cursor:pointer;text-align:left}
.opts button.right{background:#cfe7cd;border-color:var(--good)}
.opts button.wrong{background:#f0cfc7;border-color:var(--bad)}
.qmsg{min-height:24px;font-size:14px;font-weight:600;margin-top:10px}
.qmsg.good{color:var(--good)} .qmsg.bad{color:var(--bad)}
.qnext,.qquit{margin-top:10px;padding:9px 14px;border-radius:4px;border:1.5px solid var(--rule);background:var(--ink);color:var(--paper);font:600 14px inherit;cursor:pointer}
.qquit{background:var(--paper);color:var(--ink2);margin-left:8px}
.scorecard{text-align:center;padding:18px 6px}
.scorecard .big{font-family:Georgia,serif;font-size:44px;color:var(--red)}
.mapmode{font-size:13px;background:var(--red);color:var(--paper);border-radius:4px;padding:6px 10px;display:inline-block;margin-bottom:8px}

.zoomctl{position:absolute;top:14px;left:14px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoomctl button{width:36px;height:36px;border:1.5px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink);font:700 18px/1 Georgia,serif;cursor:pointer;box-shadow:0 1px 3px rgba(60,49,34,.25)}
.zoomctl button:hover{background:var(--paper2)}
#stateCard{position:absolute;top:14px;right:14px;width:302px;max-height:calc(100% - 28px);overflow:auto;background:var(--paper2);border:2px solid var(--rule);border-radius:6px;padding:12px;box-shadow:0 5px 20px rgba(60,49,34,.38);z-index:6;display:none}
#stateCard.open{display:block}
#stateCard h2{padding-right:26px}
.cardclose{position:absolute;top:8px;right:8px;width:27px;height:27px;border:1px solid var(--rule);border-radius:50%;background:var(--paper);cursor:pointer;font:700 13px/1 inherit;color:var(--ink2)}
.cardclose:hover{background:var(--t1)}
.chipgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:10px}
.chipgrid button{padding:8px 0;border:1.5px solid var(--rule);border-radius:4px;background:var(--paper);font:700 12px inherit;color:var(--ink2);cursor:pointer}
.chipgrid button:hover{background:var(--t0)}
.chipgrid button.v{background:var(--gold);border-color:#8a6317;color:#2e2410}

#findBanner{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:6;
  display:none;min-width:min(340px,86%);max-width:92%;text-align:center;
  background:var(--ink);color:var(--paper);border-radius:8px;padding:10px 16px;
  box-shadow:0 4px 16px rgba(60,49,34,.4);font-size:15px}
#findBanner.open{display:block}
#findBanner .fb-prompt{font-family:Georgia,serif;font-size:19px}
#findBanner .fb-prompt b{color:var(--gold)}
#findBanner .fb-meta{font-size:12px;opacity:.85;margin-top:2px;letter-spacing:.04em}
#findBanner .fb-msg{margin-top:4px;font-weight:700;min-height:18px}
#findBanner.good{background:#256b39}#findBanner.bad{background:#8f3322}

/* map states */
.st{stroke:var(--ink);stroke-width:.7;cursor:pointer;transition:filter .12s}
.c0{fill:var(--t0)} .c1{fill:var(--t1)} .c2{fill:var(--t2)} .c3{fill:var(--t3)}
.st:hover{filter:brightness(.93)}
.st.sel.c0{fill:var(--t0h)} .st.sel.c1{fill:var(--t1h)} .st.sel.c2{fill:var(--t2h)} .st.sel.c3{fill:var(--t3h)}
.st.sel{stroke-width:1.6}
.st.visited{stroke:#6b4a12;stroke-width:2.6}
.st.visited.sel{stroke-width:2.6}
.st.flash-good{fill:#79c184 !important}
.st.flash-bad{fill:#dd8a76 !important}
.cap-star{fill:var(--red);stroke:#5a1512;stroke-width:.4;pointer-events:none}
.cap-star.pulse{animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{transform:scale(2.1)}}
.vdot{fill:var(--gold);stroke:var(--ink);stroke-width:.5;pointer-events:none}
.statelabel{font:700 10px Georgia,serif;fill:var(--ink);pointer-events:none;opacity:0;transition:opacity .2s}
.statelabel.show{opacity:1}

.foot{max-width:1180px;margin:12px auto 4px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;color:var(--ink2);font-size:12.5px}
.pill{border:1px solid var(--rule);border-radius:999px;padding:3px 10px;background:var(--paper2)}

@media(max-width:900px){
  .wrap{grid-template-columns:1fr}
  body{padding:8px}
  .side{min-height:0}
  input,select,textarea,button{font-size:16px}
  #stateCard{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:60%}
  .zoomctl{top:10px;left:10px}
  .zoomctl button{width:40px;height:40px}
}
</style>
</head>
<body>

<header class="cartouche">
  <h1>The Fifty States</h1>
  <div class="sub">A Traveler's Atlas &amp; Quiz — drawn on genuine state boundaries</div>
  <div class="rulebar">Explore · Collect · Compete</div>
</header>

<div class="wrap">
  <div class="mappanel">
    <svg id="map" role="img" aria-label="Clickable map of the United States"></svg>
    <div class="zoomctl">
      <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
      <button id="zhome" title="Reset view" aria-label="Reset view">⌂</button>
    </div>
    <div id="stateCard" role="dialog" aria-label="State information"></div>
    <div id="findBanner" aria-live="polite"></div>
    <div class="legend">
      <span><span class="cap">★</span> State capital</span>
      <span><span class="vd"></span> Been there</span>
      <span id="legendhint">Tap any state for its card</span>
    </div>
  </div>

  <aside class="side">
    <div class="tabs">
      <button id="tabExplore" class="on">Atlas</button>
      <button id="tabQuiz">Quiz</button>
    </div>
    <div id="panelExplore"></div>
    <div id="panelQuiz" style="display:none"></div>
  </aside>
</div>

<div class="foot">
  <span>Boundaries: U.S. Census–derived vectors (a few coastal stretches redrawn by hand at matching detail).</span>
  <span class="pill" id="storagePill">…</span>
</div>

const KEY='states-atlas-2026';
let memStore={}, storageMode='memory';
async function storGet(k){
  if(window.storage&&window.storage.get){try{const r=await window.storage.get(k);storageMode='cloud';return r?r.value:null;}catch(e){}}
  try{const v=localStorage.getItem(k);storageMode='local';return v;}catch(e){}
  storageMode='memory';return memStore[k]||null;
}
async function storSet(k,v){
  if(window.storage&&window.storage.set){try{await window.storage.set(k,v);storageMode='cloud';return;}catch(e){}}
  try{localStorage.setItem(k,v);storageMode='local';return;}catch(e){}
  storageMode='memory';memStore[k]=v;
}

}

/* ============ PROJECTION (Albers composite, same params as the build check) ============ */
const D2R=Math.PI/180;
function albers(l0,p0,p1,p2){
  const n=.5*(Math.sin(p1*D2R)+Math.sin(p2*D2R));
  const C=Math.cos(p1*D2R)**2+2*n*Math.sin(p1*D2R);
  const r0=Math.sqrt(C-2*n*Math.sin(p0*D2R))/n;
  return function(lon,lat){
    const r=Math.sqrt(C-2*n*Math.sin(lat*D2R))/n, t=n*(lon-l0)*D2R;
    return [r*Math.sin(t), r0-r*Math.cos(t)];
  };
}
const L48=albers(-96,38.5,29.5,45.5), AKP=albers(-152,60,55,65), HIP=albers(-157,20.5,8,18), S=1000;
function project(lon,lat,st){
  let x,y;
  if(st==='Alaska'){const p=AKP(lon,lat);x=.32*S*p[0]+.11*S;y=.32*S*p[1]-.44*S;}
  else if(st==='Hawaii'){const p=HIP(lon,lat);x=.9*S*p[0]+.42*S;y=.9*S*p[1]-.485*S;}
  else {const p=L48(lon,lat);x=S*p[0];y=S*p[1];}
  return [x,-y];
}

function ext(x,y){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}

STATES.forEach(st=>{
  let d='', bigArea=-1, cx=0, cy=0;
  let bx0=1e9,by0=1e9,bx1=-1e9,by1=-1e9;
  st.p.forEach(poly=>{
    poly.forEach(ring=>{
      const pts=ring.map(pt=>project(pt[0],pt[1],st.n));
      pts.forEach(p=>{ext(p[0],p[1]);
        if(p[0]<bx0)bx0=p[0];if(p[0]>bx1)bx1=p[0];
        if(p[1]<by0)by0=p[1];if(p[1]>by1)by1=p[1];});
      d+='M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')+'Z';
      // track largest ring for centroid/label
      let a=0,sx=0,sy=0;
      for(let i=0;i<pts.length-1;i++){const cr=pts[i][0]*pts[i+1][1]-pts[i+1][0]*pts[i][1];a+=cr;sx+=(pts[i][0]+pts[i+1][0])*cr;sy+=(pts[i][1]+pts[i+1][1])*cr;}
      a/=2;
      if(Math.abs(a)>bigArea){bigArea=Math.abs(a);cx=sx/(6*a);cy=sy/(6*a);}
    });
  });
  centroids[st.n]=[cx,cy];
  bboxes[st.n]=[bx0,by0,bx1,by1];
  const path=document.createElementNS(NS,'path');
  path.setAttribute('d',d);
  path.setAttribute('class','st c'+st.c);
  path.setAttribute('vector-effect','non-scaling-stroke');
  path.dataset.name=st.n;
  const t=document.createElementNS(NS,'title');t.textContent=st.n;path.appendChild(t);
  titles[st.n]=t;
  gStates.appendChild(path);
  shapes[st.n]=path;
});

function starD(cx,cy,r){
  let d='';
  for(let i=0;i<10;i++){
    const rr=i%2?r*.44:r, a=-Math.PI/2+i*Math.PI/5;
    d+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1);
  }
  return d+'Z';
}
STATES.forEach(st=>{

  s.setAttribute('d',starD(p[0],p[1],5));
  s.setAttribute('class','cap-star');
  s.style.transformOrigin=p[0]+'px '+p[1]+'px';

const PAD=12;
const BASE={x:minX-PAD,y:minY-PAD,w:maxX-minX+2*PAD,h:maxY-minY+2*PAD};
const R=BASE.h/BASE.w, MINW=BASE.w/18;
let view={x:BASE.x,y:BASE.y,w:BASE.w,h:BASE.h};

function updateMarkers(){
  const k=Math.max(.26,Math.min(1,view.w/BASE.w));
  for(const n in stars){const p=capPos[n];stars[n].setAttribute('d',starD(p[0],p[1],5*k));}
  for(const n in vdots){vdots[n].setAttribute('r',3.4*k);}
}
function applyView(){
  svg.setAttribute('viewBox',view.x.toFixed(2)+' '+view.y.toFixed(2)+' '+view.w.toFixed(2)+' '+view.h.toFixed(2));
  updateMarkers();
}
function clampView(v){
  v.w=Math.min(Math.max(v.w,MINW),BASE.w*1.1);
  v.h=v.w*R;
  v.x=Math.min(Math.max(v.x,BASE.x-v.w*.4),BASE.x+BASE.w-v.w*.6);
  v.y=Math.min(Math.max(v.y,BASE.y-v.h*.4),BASE.y+BASE.h-v.h*.6);
  return v;
}
let animId=null;
function animateView(t){
  if(animId)cancelAnimationFrame(animId);
  const s={x:view.x,y:view.y,w:view.w,h:view.h}, t0=performance.now(), dur=480;
  function step(now){
    const u=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-u,3);
    view={x:s.x+(t.x-s.x)*e,y:s.y+(t.y-s.y)*e,w:s.w+(t.w-s.w)*e,h:s.h+(t.h-s.h)*e};
    applyView();
    if(u<1)animId=requestAnimationFrame(step);else animId=null;
  }
  animId=requestAnimationFrame(step);
}
function toSvg(cx,cy){
  const r=svg.getBoundingClientRect();
  return [view.x+(cx-r.left)/r.width*view.w, view.y+(cy-r.top)/r.height*view.h];
}
function zoomAt(f,mx,my){
  if(animId){cancelAnimationFrame(animId);animId=null;}
  view=clampView({w:view.w*f,h:0,x:mx-(mx-view.x)*f,y:my-(my-view.y)*f});
  applyView();
}
function zoomToState(name){
  const b=bboxes[name];
  const bw=b[2]-b[0], bh=b[3]-b[1];
  let w=Math.max(bw*1.7, bh*1.7/R, MINW);
  w=Math.min(w,BASE.w);
  const cx=(b[0]+b[2])/2, cy=(b[1]+b[3])/2;
  animateView(clampView({w:w,h:0,x:cx-w/2,y:cy-w*R/2}));
}

applyView();

/* wheel zoom */
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const m=toSvg(e.clientX,e.clientY);
  const f=Math.min(1.6,Math.max(.6,Math.exp(e.deltaY*.0016)));
  zoomAt(f,m[0],m[1]);
},{passive:false});

/* drag pan + pinch zoom + tap (pointer capture only engages once a drag starts,
   so plain taps keep their original target) */
const ptrs=new Map();
let dragged=false, panStart=null, pinchStart=null, tapName=null;
function pdist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1]);}
svg.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===1){
    dragged=false;
    tapName=(e.target&&e.target.dataset&&e.target.dataset.name)||null;
    panStart={cx:e.clientX,cy:e.clientY,vx:view.x,vy:view.y};
  } else if(ptrs.size===2){
    const a=[...ptrs.values()];
    pinchStart={d:pdist(a[0],a[1]),w:view.w,
      mx:(a[0][0]+a[1][0])/2,my:(a[0][1]+a[1][1])/2,vx:view.x,vy:view.y};
    panStart=null;tapName=null;
    for(const id of ptrs.keys()){try{svg.setPointerCapture(id);}catch(_){}}
  }
});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  const r=svg.getBoundingClientRect();
  if(pinchStart&&ptrs.size===2){
    const a=[...ptrs.values()];
    const nd=pdist(a[0],a[1]);
    if(nd<10)return;
    dragged=true;
    let w=pinchStart.w*pinchStart.d/nd;
    w=Math.min(Math.max(w,MINW),BASE.w*1.1);
    const sx=pinchStart.vx+(pinchStart.mx-r.left)/r.width*pinchStart.w;
    const sy=pinchStart.vy+(pinchStart.my-r.top)/r.height*(pinchStart.w*R);
    const nmx=(a[0][0]+a[1][0])/2, nmy=(a[0][1]+a[1][1])/2;
    view=clampView({w:w,h:0,x:sx-(nmx-r.left)/r.width*w,y:sy-(nmy-r.top)/r.height*(w*R)});
    applyView();
  } else if(panStart&&ptrs.size===1){
    const dx=e.clientX-panStart.cx, dy=e.clientY-panStart.cy;
    if(!dragged&&Math.abs(dx)+Math.abs(dy)>5){
      dragged=true;tapName=null;
      svg.classList.add('panning');
      try{svg.setPointerCapture(e.pointerId);}catch(_){}
    }
    if(!dragged)return;
    view=clampView({w:view.w,h:0,
      x:panStart.vx-dx/r.width*view.w,
      y:panStart.vy-dy/r.height*view.h});
    applyView();
  }
});
function endPtr(e){
  ptrs.delete(e.pointerId);
  pinchStart=null;
  svg.classList.remove('panning');
  if(ptrs.size===0&&!dragged&&tapName&&e.type==='pointerup'){
    handleTap(tapName);
  }
  if(ptrs.size===0)tapName=null;
  if(ptrs.size===1){
    const a=[...ptrs.entries()][0];
    panStart={cx:a[1][0],cy:a[1][1],vx:view.x,vy:view.y};
    dragged=true; // finger remaining after a pinch shouldn't fire a tap
  } else panStart=null;
}
svg.addEventListener('pointerup',endPtr);
svg.addEventListener('pointercancel',endPtr);

/* double-click / double-tap to zoom */
svg.addEventListener('dblclick',e=>{
  e.preventDefault();
  const m=toSvg(e.clientX,e.clientY);
  zoomAt(.5,m[0],m[1]);
});

/* buttons */
document.getElementById('zin').onclick=()=>animateView(clampView({w:view.w*.6,h:0,x:view.x+view.w*.2,y:view.y+view.h*.2}));
document.getElementById('zout').onclick=()=>animateView(clampView({w:view.w/.6,h:0,x:view.x-view.w/3,y:view.y-view.h/3}));
document.getElementById('zhome').onclick=()=>animateView(BASE);

function renderVisited(){
  STATES.forEach(st=>{
    const has=state.visited.includes(st.n);
    if(shapes[st.n]) shapes[st.n].classList.toggle('visited',has);
  });
  updateMarkers();
}

/* ============ EXPLORE: OVERLAY CARD + INDEX ============ */
const panelExplore=document.getElementById('panelExplore');
const panelQuiz=document.getElementById('panelQuiz');
const cardEl=document.getElementById('stateCard');
let selected=null;

const ABBR={"Alabama":"AL","Alaska":"AK","Arizona":"AZ","Arkansas":"AR","California":"CA",
"Colorado":"CO","Connecticut":"CT","Delaware":"DE","Florida":"FL","Georgia":"GA",
"Hawaii":"HI","Idaho":"ID","Illinois":"IL","Indiana":"IN","Iowa":"IA","Kansas":"KS",
"Kentucky":"KY","Louisiana":"LA","Maine":"ME","Maryland":"MD","Massachusetts":"MA",
"Michigan":"MI","Minnesota":"MN","Mississippi":"MS","Missouri":"MO","Montana":"MT",
"Nebraska":"NE","Nevada":"NV","New Hampshire":"NH","New Jersey":"NJ","New Mexico":"NM",
"New York":"NY","North Carolina":"NC","North Dakota":"ND","Ohio":"OH","Oklahoma":"OK",
"Oregon":"OR","Pennsylvania":"PA","Rhode Island":"RI","South Carolina":"SC",
"South Dakota":"SD","Tennessee":"TN","Texas":"TX","Utah":"UT","Vermont":"VT",
"Virginia":"VA","Washington":"WA","West Virginia":"WV","Wisconsin":"WI","Wyoming":"WY"};

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}

function vcountHTML(){
  return '<div class="vcount">States visited: <b>'+state.visited.length+'</b> of 50</div>';
}
function renderIndex(){
  panelExplore.innerHTML=
    '<div class="hintcard" style="padding:8px 4px 2px">Tap a state on the map, or jump from the index. Pinch, scroll, or use + / − to zoom.</div>'+
    vcountHTML()+
    '<div class="chipgrid">'+STATES.map(s=>
      '<button data-n="'+esc(s.n)+'" class="'+(state.visited.includes(s.n)?'v':'')+'" title="'+esc(s.n)+'">'+ABBR[s.n]+'</button>'
    ).join('')+'</div>';
  panelExplore.querySelectorAll('.chipgrid button').forEach(b=>{
    b.onclick=()=>{selectState(b.dataset.n);};
  });
}
function closeCard(){
  cardEl.classList.remove('open');
  if(selected&&shapes[selected])shapes[selected].classList.remove('sel');
  selected=null;
}
function selectState(name){
  showCard(name);
  zoomToState(name);
}
function showCard(name){
  if(selected&&shapes[selected])shapes[selected].classList.remove('sel');
  selected=name;
  shapes[name].classList.add('sel');
  const st=stars[name];st.classList.remove('pulse');requestAnimationFrame(()=>st.classList.add('pulse'));
  const f=FACTS[name], c=CAPS[name];
  const visited=state.visited.includes(name);
  cardEl.innerHTML=
    '<button class="cardclose" id="cardClose" aria-label="Close">✕</button>'+
    '<div class="factcard">'+
    '<h2>'+esc(name)+'</h2>'+
    '<p class="nick">“'+esc(f[0])+'”</p>'+
    '<div class="frow"><b>Capital</b><span>★ '+esc(c[0])+'</span></div>'+
    '<div class="frow"><b>Statehood</b><span>'+f[1]+' · the '+ordinal(f[2])+' state</span></div>'+
    '<div class="frow"><b>Flower</b><span>'+esc(f[3])+'</span></div>'+
    '<div class="frow"><b>Bird</b><span>'+esc(f[4])+'</span></div>'+
    '<div class="frow"><b>'+esc(f[5][0])+'</b><span>'+esc(f[5][1])+'</span></div>'+
    '<div class="facts"><p>'+esc(f[6])+'</p><p>'+esc(f[7])+'</p></div>'+
    '<button class="visitbtn'+(visited?' v':'')+'" id="visitBtn">'+(visited?'✓ Been there (tap to undo)':'I\u2019ve been here')+'</button>'+
    '</div>';
  cardEl.classList.add('open');
  cardEl.scrollTop=0;
  document.getElementById('cardClose').onclick=closeCard;
  document.getElementById('visitBtn').onclick=async()=>{
    const i=state.visited.indexOf(name);
    if(i>=0)state.visited.splice(i,1);else state.visited.push(name);
    renderVisited();renderIndex();await saveState();showCard(name);
  };
}

/* ============ QUIZ ============ */
const MODES={
  find:{label:'Find the State',desc:'We name it — you tap it on the map.'},
  caps:{label:'Capital Cities',desc:'Match states and their capitals.'},
  sym:{label:'State Symbols',desc:'Birds, flowers, and mammals.'}
};
let quiz=null; // {mode, qs, i, score, tries, awaitingNext}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(arr,n,excl){const pool=arr.filter(x=>!excl||!excl(x));return shuffle(pool.slice()).slice(0,n);}
const ALLNAMES=STATES.map(s=>s.n);

function showQuizMenu(){
  quiz=null;
  hideFindBanner();
  panelQuiz.innerHTML='<div class="qmenutitle">Choose a game</div><div class="qmodes">'+Object.keys(MODES).map(m=>
    '<button data-m="'+m+'"><b>'+MODES[m].label+'<span class="best">'+(state.best[m]?('best '+state.best[m]+'/10'):'')+'</span></b><span>'+MODES[m].desc+'</span></button>'
  ).join('')+'</div>';
  panelQuiz.querySelectorAll('button').forEach(b=>b.onclick=()=>startQuiz(b.dataset.m));
}

function makeQuestions(mode){
  const qs=[];
  const states10=sample(ALLNAMES,10);
  states10.forEach(name=>{
    const f=FACTS[name];
    if(mode==='find'){qs.push({ans:name});}
    else if(mode==='caps'){
      if(Math.random()<0.5){
        const opts=shuffle([CAPS[name][0]].concat(sample(ALLNAMES,3,x=>x===name).map(s=>CAPS[s][0])));
        qs.push({q:'What is the capital of <b>'+esc(name)+'</b>?',opts,ans:CAPS[name][0]});
      } else {
        const opts=shuffle([name].concat(sample(ALLNAMES,3,x=>x===name)));
        qs.push({q:'<b>'+esc(CAPS[name][0])+'</b> is the capital of…?',opts,ans:name});
      }
    } else {
      const kinds=[['bird',4],['flower',3],['mammal',5]];
      const [kind,idx]=kinds[Math.floor(Math.random()*kinds.length)];
      const val=kind==='mammal'?f[5][1]:f[idx];
      if(val.startsWith('—')||Math.random()<0.5){
        // ask value of this state (options are distinct values)
        const vi=kind==='mammal'?(x=>FACTS[x][5][1]):(x=>FACTS[x][idx]);
        const distract=sample(ALLNAMES,8,x=>x===name||vi(x)===val||vi(x).startsWith('—')).map(vi);
        const opts=shuffle([val].concat([...new Set(distract)].slice(0,3)));
        qs.push({q:'What is the state '+(kind==='mammal'?esc(f[5][0]).toLowerCase().replace('state ',''):kind)+' of <b>'+esc(name)+'</b>?',opts,ans:val});
      } else {
        // ask which state has this value (distractors must differ on this field)
        const vi=kind==='mammal'?(x=>FACTS[x][5][1]):(x=>FACTS[x][idx]);
        const opts=shuffle([name].concat(sample(ALLNAMES,3,x=>vi(x)===val)));
        qs.push({q:'Which state\u2019s '+kind+' is the <b>'+esc(val)+'</b>?',opts,ans:name});
      }
    }
  });
  return qs;
}

function startQuiz(mode){
  quiz={mode,qs:makeQuestions(mode),i:0,score:0,tries:0,awaitingNext:false};
  closeCard();
  if(mode==='find')animateView(BASE);
  renderQuestion();
}

function qHeader(){
  return '<div class="qhead"><span>'+MODES[quiz.mode].label+'</span><span>Question <b>'+(quiz.i+1)+'</b>/10 · Score <b>'+quiz.score+'</b></span></div>';
}

function renderQuestion(){
  const q=quiz.qs[quiz.i];
  if(quiz.mode==='find'){
    quiz.tries=0;
    panelQuiz.innerHTML=qHeader()+
      '<div class="mapmode">Tap the state on the map ↖</div>'+
      '<div class="question">Find: <b>'+esc(q.ans)+'</b></div>'+
      '<div class="qmsg" id="qmsg"></div>'+
      '<button class="qquit" id="qquit">Quit</button>';
    showFindBanner();
  } else {
    panelQuiz.innerHTML=qHeader()+
      '<div class="question">'+q.q+'</div>'+
      '<div class="opts" id="opts">'+q.opts.map(o=>'<button>'+esc(o)+'</button>').join('')+'</div>'+
      '<div class="qmsg" id="qmsg"></div>'+
      '<button class="qquit" id="qquit">Quit</button>';
    document.querySelectorAll('#opts button').forEach(b=>b.onclick=()=>answerMC(b));
  }
  document.getElementById('qquit').onclick=()=>{hideFindBanner();showQuizMenu();};
}

function answerMC(btn){
  if(quiz.awaitingNext)return;
  quiz.awaitingNext=true;
  const q=quiz.qs[quiz.i];
  const right=btn.textContent===q.ans;
  btn.classList.add(right?'right':'wrong');
  if(!right){document.querySelectorAll('#opts button').forEach(b=>{if(b.textContent===q.ans)b.classList.add('right');});}
  if(right)quiz.score++;
  const m=document.getElementById('qmsg');
  m.textContent=right?'Correct!':'Not quite.';
  m.className='qmsg '+(right?'good':'bad');
  setTimeout(nextQ,1100);
}

function mapClickQuiz(name){
  if(!quiz||quiz.mode!=='find'||quiz.awaitingNext)return;
  const q=quiz.qs[quiz.i];
  const m=document.getElementById('qmsg');
  function say(t,kind){if(m){m.textContent=t;m.className='qmsg '+kind;}setFindMsg(t,kind);}
  if(name===q.ans){
    quiz.awaitingNext=true;quiz.score++;
    flash(name,'good');
    say('Correct! ✓','good');
    setTimeout(nextQ,950);
  } else {
    quiz.tries++;
    flash(name,'bad');
    if(quiz.tries>=3){
      quiz.awaitingNext=true;
      flash(q.ans,'good');
      say('That was '+name+'. '+q.ans+' is here →','bad');
      zoomToState(q.ans);
      setTimeout(nextQ,1700);
    } else {
      say('That\u2019s '+name+' — '+(3-quiz.tries)+' '+(quiz.tries===2?'try':'tries')+' left.','bad');
    }
  }
}

function flash(name,kind){
  const p=shapes[name];
  p.classList.add('flash-'+kind);
  setTimeout(()=>p.classList.remove('flash-'+kind),800);
}

const findBanner=document.getElementById('findBanner');
function showFindBanner(){
  const q=quiz.qs[quiz.i];
  findBanner.className='open';
  findBanner.innerHTML=
    '<div class="fb-prompt">Find: <b>'+esc(q.ans)+'</b></div>'+
    '<div class="fb-meta">Question '+(quiz.i+1)+' / 10 · Score '+quiz.score+' · '+(3-quiz.tries)+' tries left</div>'+
    '<div class="fb-msg" id="fbmsg"></div>';
}
function setFindMsg(txt,kind){
  const el=document.getElementById('fbmsg');
  if(el)el.textContent=txt;
  findBanner.className='open'+(kind?' '+kind:'');
}
function hideFindBanner(){findBanner.className='';}

async function nextQ(){
  quiz.awaitingNext=false;
  quiz.i++;
  if(quiz.i>=10){
    const mode=quiz.mode, score=quiz.score;
    const prevBest=state.best[mode]||0;
    const best=Math.max(prevBest,score);
    const isNew=best>prevBest;
    state.best[mode]=best;await saveState();
    hideFindBanner();
    panelQuiz.innerHTML='<div class="scorecard">'+
      '<div>'+MODES[mode].label+'</div>'+
      '<div class="big">'+score+'/10</div>'+
      '<div>'+(score===10?'Perfect — cartographer rank! 🗺️':score>=7?'Impressive navigation!':score>=4?'Getting there — the map remembers.':'Every explorer starts somewhere.')+'</div>'+
      (isNew&&score>0?'<p><b>New best!</b></p>':'')+
      '<button class="qnext" id="again">Play again</button>'+
      '<button class="qquit" id="menu">Modes</button></div>';
    quiz=null;
    document.getElementById('again').onclick=()=>startQuiz(mode);
    document.getElementById('menu').onclick=showQuizMenu;
  } else if(quiz.mode==='find'){
    quiz.awaitingNext=false;
    renderQuestion();
  } else renderQuestion();
}

/* ============ TABS & MAP EVENTS ============ */
const tabE=document.getElementById('tabExplore'), tabQ=document.getElementById('tabQuiz');
let quizTab=false;
function setStateTooltips(on){
  for(const n in titles){
    const t=titles[n], p=shapes[n];
    if(on){ if(t.parentNode!==p)p.appendChild(t); }
    else { if(t.parentNode)t.remove(); }
  }
}
function setTab(q){
  quizTab=q;
  tabE.classList.toggle('on',!q);tabQ.classList.toggle('on',q);
  panelExplore.style.display=q?'none':'';
  panelQuiz.style.display=q?'':'none';
  document.getElementById('legendhint').textContent=q?'Quiz mode — the map is your answer sheet':'Tap any state for its card';
  setStateTooltips(!q); // hover-name would give away "Find the State"
  if(q)closeCard();else hideFindBanner();
}
tabE.onclick=()=>setTab(false);
tabQ.onclick=()=>{setTab(true);if(!quiz)showQuizMenu();};

function handleTap(name){
  if(quizTab){
    // In the Quiz tab: a map tap answers a "Find the State" question.
    // For multiple-choice modes or the mode menu, taps on the map do nothing
    // (so you never get bounced out of the quiz, and answers aren't revealed).
    if(quiz&&quiz.mode==='find')mapClickQuiz(name);
    else if(!quiz)nudgePickMode();
    return;
  }
  selectState(name);
}

let nudgeTimer=null;
function nudgePickMode(){
  const h=document.getElementById('legendhint');
  h.textContent='Pick a quiz mode first ↗';
  clearTimeout(nudgeTimer);
  nudgeTimer=setTimeout(()=>{h.textContent='Quiz mode — the map is your answer sheet';},1800);
}

/* ============ INIT ============ */
loadState().then(()=>{renderVisited();renderIndex();pill();});
</script>
